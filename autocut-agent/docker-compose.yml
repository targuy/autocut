version: '3.8'

services:
  # Main Agent Service
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autocut-agent
    restart: unless-stopped
    ports:
      - "8080:8080"  # API/GUI
      - "9090:9090"  # Metrics
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    environment:
      - AGENT_DATABASE_URL=postgresql://agent:agent_password@db:5432/autocut
      - AGENT_REDIS_URL=redis://redis:6379/0
      - AGENT_LOG_LEVEL=INFO
      - API_SECRET_KEY=${API_SECRET_KEY:-changeme-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-network
    # Uncomment for GPU support (requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: autocut-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=agent_password
      - POSTGRES_DB=autocut
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  # Redis Cache & Locking
  redis:
    image: redis:7-alpine
    container_name: autocut-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: autocut-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - agent
    networks:
      - agent-network
    profiles:
      - production

  # Optional: Prometheus for Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: autocut-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - agent-network
    profiles:
      - monitoring

  # Optional: Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: autocut-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - agent-network
    profiles:
      - monitoring

networks:
  agent-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
