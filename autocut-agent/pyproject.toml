[tool.poetry]
name = "autocut-agent"
version = "0.1.0"
description = "Intelligent task orchestration system for executing Python programs with multi-trigger support, resource management, and LLM integration"
authors = ["AutoCut Team"]
readme = "README.md"
license = "MIT"
packages = [{include = "agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
# Web Framework
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-multipart = "^0.0.6"
# Data Validation
pydantic = "^2.0"
pydantic-settings = "^2.0"
# Database
sqlalchemy = "^2.0"
alembic = "^1.12"
aiosqlite = "^0.19.0"
# Task Scheduling & Queue
apscheduler = "^3.10"
# File System Monitoring
watchdog = "^3.0"
# Redis for caching and locking
redis = "^5.0"
# LLM Integration
langchain = "^0.1.0"
langchain-openai = "^0.0.2"
langchain-anthropic = "^0.0.1"
openai = "^1.0"
anthropic = "^0.7"
# Configuration
pyyaml = "^6.0"
python-dotenv = "^1.0"
# Logging & Monitoring
structlog = "^23.2"
# System utilities
psutil = "^5.9"
# HTTP client
httpx = "^0.25"
aiofiles = "^23.2"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
# Code Quality
ruff = "^0.1"
black = "^23.0"
mypy = "^1.7"
# Pre-commit
pre-commit = "^3.5"

[tool.poetry.scripts]
autocut-agent = "agent.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/agent --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
