[tool.poetry]
name = "AutoCutVideo"
version = "0.1.0"
description = "projet de découpe automatique des scenes avec personnes"
authors = ["Benoit Guitard <benoit@familleguitard.fr>"]
readme = "README.md"

# Package configuration: include your code directories as packages
packages = [
  { include = "cli" },
  { include = "pipeline" },
  { include = "segmenters" },
  { include = "detectors" },
  { include = "gpu_video_tools" }
]

[tool.poetry.dependencies]
python = "^3.10"
opencv-python = "^4.11.0.86"
ultralytics = "^8.3.131"
numpy = "^1.26"
pyyaml = "^6.0.2"
transformers = "^4.51.3"
huggingface-hub = "^0.31.1"
nsfw-image-detector = "^0.1.2"
mediapipe = "^0.10.0"
torch = "*"
torchvision = "*"
tqdm = "^4.66.4"
click = "^8.1.7"
rich = "^13.7.0"
pandas = "^2.2.0"
tomli = "^2.0.1"
tomli-w = "^1.0.0"
scenedetect = {version = "^0.6.3", extras = ["opencv"]}
onnxruntime = "^1.17.0"
psutil = "^5.9.0"
pynvml = "^11.5.0"
gputil = "^1.4.0"
pywin32 = {version = "^306", markers = "sys_platform == 'win32'"}
wmi = {version = "^1.5.1", markers = "sys_platform == 'win32'"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
flake8 = "^7.2.0"
black = "^25.1.0"

[tool.poetry.scripts]
autocut = "cli.process_video:main"
gpu-tools = "gpu_video_tools.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
